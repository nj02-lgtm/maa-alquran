<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Juz list toggle</title>
<style>
  :root{
    --jz-bg:#ffffff;
    --jz-surface:#f4f4f2;
    --jz-text:#1a1a19;
    --jz-text-soft:#6b6b66;
    --jz-line:rgba(0,0,0,.10);
    --jz-badge-bg:#e6f1fb;
    --jz-badge-text:#185fa5;
    --jz-active-bg:#0f6e56;
    --jz-active-text:#ffffff;
    --jz-radius:10px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --jz-bg:#1c1c1b;
      --jz-surface:#2a2a28;
      --jz-text:#f2f2f0;
      --jz-text-soft:#a3a39c;
      --jz-line:rgba(255,255,255,.12);
      --jz-badge-bg:#0c447c;
      --jz-badge-text:#b5d4f4;
      --jz-active-bg:#5dcaa5;
      --jz-active-text:#04342c;
    }
  }

  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--jz-bg);
    color:var(--jz-text);
    -webkit-text-size-adjust:100%;
  }
  .page{
    max-width:900px;
    margin:0 auto;
    padding:16px;
    padding-inline:max(16px,env(safe-area-inset-left)) max(16px,env(safe-area-inset-right));
    padding-bottom:max(16px,env(safe-area-inset-bottom));
  }

  /* ---------- component ---------- */
  .juz-panel{
    background:var(--jz-bg);
    border:1px solid var(--jz-line);
    border-radius:14px;
    overflow:hidden;
  }

  .juz-toggle{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    width:100%;
    min-height:52px;
    padding:10px 14px;
    background:transparent;
    border:0;
    border-radius:14px;
    font:inherit;
    color:inherit;
    text-align:start;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  .juz-toggle:hover{background:var(--jz-surface)}
  .juz-toggle:focus-visible{outline:2px solid var(--jz-badge-text);outline-offset:-2px}

  .juz-title-group{display:flex;align-items:center;gap:9px;min-width:0}
  .juz-title{
    font-size:16px;font-weight:500;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .juz-count{
    flex:none;
    font-size:12px;line-height:1;
    padding:5px 9px;border-radius:999px;
    background:var(--jz-badge-bg);color:var(--jz-badge-text);
    font-variant-numeric:tabular-nums;
  }

  .juz-action{
    flex:none;
    display:flex;align-items:center;gap:5px;
    font-size:13px;color:var(--jz-text-soft);
  }
  .juz-action-word{white-space:nowrap}
  .juz-chevron{
    width:18px;height:18px;flex:none;
    transition:transform .2s ease;
  }
  .juz-panel.is-open .juz-chevron{transform:rotate(180deg)}

  .juz-body{
    overflow:hidden;
    max-height:0;
    transition:max-height .25s ease;
  }
  .juz-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(46px,1fr));
    gap:6px;
    padding:4px 14px 14px;
    border-top:1px solid var(--jz-line);
    margin-top:0;
  }
  .juz-cell{
    min-height:44px;
    display:flex;align-items:center;justify-content:center;
    border:0;
    border-radius:var(--jz-radius);
    background:var(--jz-surface);
    color:var(--jz-text);
    font:inherit;font-size:15px;
    font-variant-numeric:tabular-nums;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  .juz-cell[aria-current="true"]{background:var(--jz-active-bg);color:var(--jz-active-text)}
  .juz-cell:focus-visible{outline:2px solid var(--jz-badge-text);outline-offset:2px}

  /* very narrow phones (Galaxy A21s ~360px, older 320px) */
  @media (max-width:380px){
    .juz-grid{grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:5px;padding:4px 10px 10px}
    .juz-toggle{padding:10px}
    .juz-title{font-size:15px}
    .juz-action-word{display:none}
  }

  /* landscape phones: short viewport, wide row */
  @media (orientation:landscape) and (max-height:480px){
    .juz-grid{grid-template-columns:repeat(auto-fill,minmax(50px,1fr))}
    .juz-toggle{min-height:44px}
  }

  @media (prefers-reduced-motion:reduce){
    .juz-body,.juz-chevron{transition:none}
  }

  .demo-note{font-size:13px;color:var(--jz-text-soft);margin:14px 2px 0;line-height:1.6}
</style>
</head>
<body>
<div class="page">

  <div class="juz-panel is-open" id="juzPanel">
    <button class="juz-toggle" id="juzToggle" type="button"
            aria-expanded="true" aria-controls="juzBody">
      <span class="juz-title-group">
        <span class="juz-title">Juz’ list</span>
        <span class="juz-count" id="juzCount">30</span>
      </span>
      <span class="juz-action">
        <span class="juz-action-word" id="juzActionWord">Hide</span>
        <svg class="juz-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </span>
    </button>

    <div class="juz-body" id="juzBody">
      <div class="juz-grid" id="juzGrid"></div>
    </div>
  </div>

  <p class="demo-note">
    Rotate the device or resize the window — the grid reflows and the collapse height recalculates.
  </p>

</div>

<script>
(function () {
  var TOTAL = 30;

  var panel  = document.getElementById('juzPanel');
  var btn    = document.getElementById('juzToggle');
  var body   = document.getElementById('juzBody');
  var grid   = document.getElementById('juzGrid');
  var word   = document.getElementById('juzActionWord');
  var count  = document.getElementById('juzCount');

  var current = 1;

  for (var i = 1; i <= TOTAL; i++) {
    var cell = document.createElement('button');
    cell.type = 'button';
    cell.className = 'juz-cell';
    cell.textContent = i;
    cell.setAttribute('aria-label', 'Juz ' + i);
    cell.setAttribute('aria-current', i === current ? 'true' : 'false');
    cell.dataset.juz = i;
    grid.appendChild(cell);
  }
  count.textContent = TOTAL;

  grid.addEventListener('click', function (e) {
    var cell = e.target.closest('.juz-cell');
    if (!cell) return;
    grid.querySelectorAll('.juz-cell').forEach(function (c) {
      c.setAttribute('aria-current', 'false');
    });
    cell.setAttribute('aria-current', 'true');
    current = Number(cell.dataset.juz);
    panel.dispatchEvent(new CustomEvent('juz:select', { detail: { juz: current } }));
  });

  function isOpen() { return panel.classList.contains('is-open'); }

  function measure() {
    return grid.getBoundingClientRect().height + 'px';
  }

  function setOpen(open, animate) {
    panel.classList.toggle('is-open', open);
    btn.setAttribute('aria-expanded', String(open));
    word.textContent = open ? 'Hide' : 'Show';
    btn.setAttribute('aria-label', (open ? 'Hide' : 'Show') + ' juz number list');

    if (!animate) {
      body.style.transition = 'none';
      body.style.maxHeight = open ? measure() : '0px';
      void body.offsetHeight;
      body.style.transition = '';
      return;
    }
    if (open) {
      body.style.maxHeight = measure();
    } else {
      body.style.maxHeight = measure();
      void body.offsetHeight;
      body.style.maxHeight = '0px';
    }
  }

  btn.addEventListener('click', function () { setOpen(!isOpen(), true); });

  function resync() { if (isOpen()) setOpen(true, false); }

  window.addEventListener('resize', resync);
  window.addEventListener('orientationchange', function () {
    setTimeout(resync, 250);
  });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', resync);
  }

  setOpen(true, false);

  window.juzList = {
    open:   function () { setOpen(true, true); },
    close:  function () { setOpen(false, true); },
    toggle: function () { setOpen(!isOpen(), true); },
    get selected() { return current; }
  };
})();
</script>
</body>
</html>
